# Baseline: ResNet-50, ImageNet-pretrained, Clean images, official patient-level split.
run_name: baseline_resnet50
experiment_kind: baseline
arch: resnet50
pretrained: true
image_size: 224
variant: clean
augment: basic
batch_size: 32
epochs: 30
freeze_epochs: 2
lr: 0.0003
backbone_lr_mult: 0.1
weight_decay: 0.0001
monitor: val_auroc
patience: 8
seed: 42
threshold: 0.5
