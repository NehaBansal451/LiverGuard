[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "liverguard"
version = "0.1.0"
description = "Auditing and improving the reliability of liver ultrasound AI (research platform, not a clinical tool)."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "pillow>=10.0",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
    "pydantic>=2.5",
]

[tool.setuptools.packages.find]
include = ["liverguard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
